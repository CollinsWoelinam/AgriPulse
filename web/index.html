<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriPulse</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #f6f7f4; --panel: #ffffff; --text: #1d2420; --muted: #66706a; --line: #dde2dc;
    --accent: #2f7d4a; --accent-text: #ffffff; --danger: #b8402f; --zone: #e0452b;
    --series-1: #2a78d6; --critical: #d03b3b; --grid: #e1e0d9; --axis: #c3c2b7; --axis-text: #898781;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121614; --panel: #1b201d; --text: #e6ebe7; --muted: #95a09a; --line: #2c332f;
            --accent: #5cb57a; --accent-text: #0c120e; --danger: #e2735f;
            --series-1: #3987e5; --grid: #2c2c2a; --axis: #383835; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; color: var(--text); background: var(--bg);
         display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
                  background: var(--bg); color: var(--text); margin-bottom: 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li.field { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  li.field.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  li.field small { color: var(--muted); display: block; }
  .row { display: flex; gap: 8px; align-items: center; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .stat { background: var(--bg); border-radius: 6px; padding: 6px 8px; }
  .stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; }
  .legend { height: 8px; border-radius: 4px; margin-top: 10px;
            background: linear-gradient(90deg, #a50026, #f46d43, #fee08b, #a6d96a, #1a9850, #006837); }
  .legend-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  #status { min-height: 1.4em; }
  figure { margin: 4px 0 12px; position: relative; }
  figcaption { font-weight: 600; margin-bottom: 2px; }
  figcaption span { font-weight: 400; color: var(--muted); }
  #trend-svg { display: block; width: 100%; height: 170px; touch-action: none; cursor: pointer; }
  #trend-svg text { font-size: 10px; fill: var(--axis-text); font-variant-numeric: tabular-nums; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
         border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgb(0 0 0 / .15);
         white-space: nowrap; z-index: 2; }
  #tip b { font-size: 13px; font-variant-numeric: tabular-nums; }
  #tip .key { display: inline-block; width: 12px; height: 2px; background: var(--series-1); vertical-align: middle; margin-right: 4px; }
  #tip .alert, .stat .alert { color: var(--critical); }
  details { margin-top: 10px; font-size: 12px; }
  summary { cursor: pointer; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  #map { height: 100vh; }
  [hidden] { display: none !important; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    #map { height: 55vh; grid-row: 1; }
    aside { grid-row: 2; border-right: 0; }
  }
</style>
</head>
<body>
<aside>
  <h1>AgriPulse</h1>
  <p class="sub">Sentinel-2 NDVI field health</p>

  <div class="row">
    <button id="draw" class="primary">Draw field</button>
    <span class="hint" id="draw-hint" hidden>Click to add points, double-click to finish.</span>
  </div>
  <form id="field-form" hidden>
    <h2>New field</h2>
    <input id="f-name" placeholder="Field name" required maxlength="100">
    <input id="f-crop" placeholder="Crop type (e.g. wheat)" required maxlength="50">
    <div class="row"><button class="primary" type="submit">Save</button><button type="button" id="cancel">Cancel</button></div>
  </form>

  <h2>Fields</h2>
  <ul id="fields"><li class="hint">No fields yet.</li></ul>

  <section id="detail" hidden>
    <h2>Health</h2>
    <div class="row">
      <button id="process">Fetch last 90 days</button>
      <button id="delete" title="Delete field">Delete</button>
    </div>
    <p id="status" class="hint"></p>
    <div id="timeline" hidden>
      <figure>
        <figcaption>Mean NDVI <span>· shaded: min–max range</span></figcaption>
        <svg id="trend-svg" role="img" aria-label="Mean NDVI per satellite pass"></svg>
        <div id="tip" hidden></div>
      </figure>
      <label class="hint" for="slider">Pass: <b id="pass-date"></b></label>
      <input id="slider" type="range" min="0" value="0" step="1">
      <div class="stats" id="stats"></div>
      <div class="legend"></div>
      <div class="legend-labels"><span>-0.2</span><span>NDVI</span><span>0.9</span></div>
      <p class="hint">Red outlines: stress zones · dots: scouting targets.</p>
      <details>
        <summary>All passes as a table</summary>
        <table>
          <thead><tr><th>Date</th><th>Mean</th><th>Change</th><th>Stressed</th><th>Cloud-free</th></tr></thead>
          <tbody id="pass-table"></tbody>
        </table>
      </details>
    </div>
  </section>
</aside>
<div id="map"></div>

<script>
const API = "/api";
const $ = (id) => document.getElementById(id);
let fields = [], selected = null, passes = [], draft = null;

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      imagery: { type: "raster", tileSize: 256, maxzoom: 19,
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        attribution: "Imagery © Esri · NDVI: Copernicus Sentinel-2" },
    },
    layers: [{ id: "imagery", type: "raster", source: "imagery" }],
  },
  center: [5.05, 52.05], zoom: 12,
});
map.addControl(new maplibregl.NavigationControl(), "top-right");

const empty = { type: "FeatureCollection", features: [] };
map.on("load", () => {
  map.addSource("fields", { type: "geojson", data: empty });
  map.addLayer({ id: "fields-fill", type: "fill", source: "fields", paint: { "fill-color": "#fff", "fill-opacity": 0.05 } });
  map.addLayer({ id: "fields-line", type: "line", source: "fields",
    paint: { "line-color": ["case", ["get", "active"], "#ffffff", "#c9d6cc"], "line-width": ["case", ["get", "active"], 2.5, 1.2] } });
  map.addSource("zones", { type: "geojson", data: empty });
  map.addLayer({ id: "zones-line", type: "line", source: "zones", paint: { "line-color": "#e0452b", "line-width": 1.5 } });
  map.addSource("targets", { type: "geojson", data: empty });
  map.addLayer({ id: "targets", type: "circle", source: "targets",
    paint: { "circle-radius": 5, "circle-color": "#e0452b", "circle-stroke-color": "#fff", "circle-stroke-width": 1.5 } });
  map.addSource("draft", { type: "geojson", data: empty });
  map.addLayer({ id: "draft-line", type: "line", source: "draft", paint: { "line-color": "#ffd23f", "line-width": 2, "line-dasharray": [2, 1] } });
  map.addLayer({ id: "draft-pts", type: "circle", source: "draft", filter: ["==", "$type", "Point"],
    paint: { "circle-radius": 4, "circle-color": "#ffd23f" } });
  map.on("click", "fields-fill", (e) => { if (!draft) select(e.features[0].properties.id); });
  map.on("click", "targets", (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup().setLngLat(e.lngLat)
      .setHTML(`Mean NDVI <b>${p.mean_ndvi.toFixed(2)}</b><br>${(p.area_sqm / 10000).toFixed(2)} ha`).addTo(map);
  });
  mapLoaded = true;
  mapQueue.splice(0).forEach((fn) => fn());
});

// The sidebar works without the map (e.g. WebGL unavailable); map updates wait for its style to load.
let mapLoaded = false;
const mapQueue = [];
const whenMap = (fn) => (mapLoaded ? fn() : mapQueue.push(fn));

async function api(path, opts = {}) {
  const res = await fetch(API + path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.status === 204 ? null : res.json();
}

// ---- Field drawing ----
function renderDraft() {
  const pts = draft.map((c) => ({ type: "Feature", geometry: { type: "Point", coordinates: c } }));
  const ring = draft.length > 1 ? [{ type: "Feature", geometry: { type: "LineString", coordinates: [...draft, draft[0]] } }] : [];
  map.getSource("draft").setData({ type: "FeatureCollection", features: [...ring, ...pts] });
}
function stopDrawing() {
  draft = null; map.getSource("draft").setData(empty);
  map.doubleClickZoom.enable(); map.getCanvas().style.cursor = "";
  $("draw-hint").hidden = true; $("field-form").hidden = true; $("draw").disabled = false;
}
$("draw").onclick = () => {
  draft = []; map.doubleClickZoom.disable(); map.getCanvas().style.cursor = "crosshair";
  $("draw-hint").hidden = false; $("draw").disabled = true;
};
map.on("click", (e) => {
  if (!draft || !$("field-form").hidden) return;
  draft.push([e.lngLat.lng, e.lngLat.lat]); renderDraft();
});
map.on("dblclick", () => {
  if (!draft) return;
  draft = draft.filter((c, i) => i === 0 || c[0] !== draft[i - 1][0] || c[1] !== draft[i - 1][1]);
  if (draft.length < 3) return;
  renderDraft(); $("draw-hint").hidden = true; $("field-form").hidden = false; $("f-name").focus();
});
$("cancel").onclick = stopDrawing;
$("field-form").onsubmit = async (e) => {
  e.preventDefault();
  try {
    const f = await api("/fields", { method: "POST", body: JSON.stringify({
      field_name: $("f-name").value, crop_type: $("f-crop").value,
      boundary: { type: "Polygon", coordinates: [[...draft, draft[0]]] } }) });
    stopDrawing(); $("field-form").reset();
    await loadFields(); select(f.id);
  } catch (err) { alert(err.message); }
};

// ---- Fields ----
async function loadFields() {
  fields = await api("/fields");
  const ul = $("fields");
  ul.innerHTML = fields.length ? "" : '<li class="hint">No fields yet.</li>';
  for (const f of fields) {
    const li = document.createElement("li");
    li.className = "field" + (f.id === selected ? " active" : "");
    li.innerHTML = `<b></b><small></small>`;
    li.querySelector("b").textContent = f.field_name;
    li.querySelector("small").textContent = `${f.crop_type} · ${f.area_hectares} ha`;
    li.onclick = () => select(f.id, true);
    ul.appendChild(li);
  }
  whenMap(() => map.getSource("fields").setData({ type: "FeatureCollection", features: fields.map((f) => ({
    type: "Feature", geometry: f.boundary, properties: { id: f.id, active: f.id === selected } })) }));
}

function bounds(geom) {
  const b = new maplibregl.LngLatBounds();
  geom.coordinates.flat(2).forEach((c) => b.extend(c));
  return b;
}

async function select(id, fly = false) {
  selected = id;
  history.replaceState(null, "", `#field=${id}`);
  const f = fields.find((x) => x.id === id);
  await loadFields();
  if (fly && f) map.fitBounds(bounds(f.boundary), { padding: 60, maxZoom: 16 });
  $("detail").hidden = false; $("status").textContent = "";
  await loadStats();
}

async function loadStats() {
  passes = await api(`/fields/${selected}/stats`);
  $("timeline").hidden = !passes.length;
  if (!passes.length) {
    whenMap(clearOverlays);
    $("status").textContent = "No passes yet. Fetch imagery to start.";
    return;
  }
  $("slider").max = passes.length - 1; $("slider").value = passes.length - 1;
  renderTable();
  showPass(passes.length - 1);
}

// ---- Formatting ----
const fmtDate = (d) => new Date(d + "T00:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
const signed = (v) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(2);
const changeText = (p) => p.mean_change === null ? "—" : (p.alert ? "▼ " : "") + signed(p.mean_change);
function node(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function renderTable() {
  $("pass-table").replaceChildren(...passes.map((p) => {
    const tr = node("tr");
    tr.append(node("td", p.acquisition_date), node("td", p.mean_ndvi.toFixed(2)),
      node("td", changeText(p), p.alert ? "alert" : ""), node("td", `${p.stressed_pct}%`),
      node("td", `${Math.round(p.valid_fraction * 100)}%`));
    return tr;
  }));
}

// ---- Trend chart: mean NDVI line, min–max band, crosshair tooltip, click to select ----
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}

function renderChart(sel) {
  const svg = $("trend-svg");
  svg.replaceChildren();
  const W = svg.clientWidth, H = svg.clientHeight, m = { l: 26, r: 10, t: 16, b: 18 };
  if (!W || !passes.length) return;
  const t = passes.map((p) => Date.parse(p.acquisition_date));
  const t0 = Math.min(...t), span = Math.max(...t) - t0;
  const yMin = Math.min(0, Math.floor(Math.min(...passes.map((p) => p.min_ndvi)) * 5) / 5);
  const x = (v) => m.l + (span ? (v - t0) / span : 0.5) * (W - m.l - m.r);
  const y = (v) => m.t + (1 - (v - yMin) / (1 - yMin)) * (H - m.t - m.b);

  for (let v = yMin; v <= 1.0001; v += 0.2) {
    const yy = y(v), zero = Math.abs(v) < 1e-9;
    svgEl("line", { x1: m.l, x2: W - m.r, y1: yy, y2: yy, stroke: zero ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, svg);
    svgEl("text", { x: m.l - 4, y: yy + 3, "text-anchor": "end" }, svg).textContent = v.toFixed(1);
  }
  const ticks = passes.length > 2 ? [0, Math.floor((passes.length - 1) / 2), passes.length - 1] : passes.map((_, i) => i);
  ticks.forEach((i, k) => {
    const anchor = ticks.length > 1 && k === 0 ? "start" : k === ticks.length - 1 && ticks.length > 1 ? "end" : "middle";
    svgEl("text", { x: x(t[i]), y: H - 4, "text-anchor": anchor }, svg).textContent = fmtDate(passes[i].acquisition_date);
  });

  const pts = (key) => passes.map((p, i) => `${x(t[i]).toFixed(1)},${y(p[key]).toFixed(1)}`);
  svgEl("path", { d: `M${pts("max_ndvi").join("L")}L${pts("min_ndvi").reverse().join("L")}Z`,
    fill: "var(--series-1)", "fill-opacity": 0.14 }, svg);
  svgEl("path", { d: `M${pts("mean_ndvi").join("L")}`, fill: "none", stroke: "var(--series-1)",
    "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  const cross = svgEl("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis-text)", "stroke-width": 1, visibility: "hidden" }, svg);

  passes.forEach((p, i) => {
    const cx = x(t[i]), cy = y(p.mean_ndvi);
    if (i === sel) svgEl("circle", { cx, cy, r: 8, fill: "none", stroke: "var(--text)", "stroke-width": 1.5 }, svg);
    svgEl("circle", { cx, cy, r: 4, fill: p.alert ? "var(--critical)" : "var(--series-1)",
      stroke: "var(--panel)", "stroke-width": 2 }, svg);
    if (p.alert) {
      const anchor = cx > W - m.r - 20 ? "end" : cx < m.l + 20 ? "start" : "middle";
      // Below the marker: the line arrives from above on a drop.
      svgEl("text", { x: cx, y: cy + 18, "text-anchor": anchor, style: "fill: var(--text); font-weight: 600" }, svg)
        .textContent = `▼ ${Math.abs(p.mean_change).toFixed(2)}`;
    }
  });

  const nearest = (evt) => {
    const px = evt.clientX - svg.getBoundingClientRect().left;
    let best = 0;
    t.forEach((v, i) => { if (Math.abs(x(v) - px) < Math.abs(x(t[best]) - px)) best = i; });
    return best;
  };
  svg.onpointermove = (evt) => {
    const i = nearest(evt), p = passes[i], cx = x(t[i]);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    const tip = $("tip");
    const head = node("div"); head.append(node("b", p.mean_ndvi.toFixed(2)), " mean NDVI");
    head.prepend(node("span", undefined, "key"));
    const rows = [node("div", fmtDate(p.acquisition_date)), head,
      node("div", `${p.min_ndvi.toFixed(2)}–${p.max_ndvi.toFixed(2)} range`),
      node("div", `${p.stressed_pct}% stressed · ${Math.round(p.valid_fraction * 100)}% cloud-free`)];
    if (p.alert) rows.push(node("div", `▼ Alert: ${signed(p.mean_change)} vs previous pass`, "alert"));
    tip.replaceChildren(...rows);
    tip.hidden = false;
    const right = cx + 12 + tip.offsetWidth <= W;
    tip.style.left = `${Math.max(right ? cx + 12 : cx - 12 - tip.offsetWidth, 0)}px`;
    tip.style.top = "20px";
  };
  svg.onpointerleave = () => { cross.setAttribute("visibility", "hidden"); $("tip").hidden = true; };
  svg.onclick = (evt) => { const i = nearest(evt); $("slider").value = i; showPass(i); };
}
window.addEventListener("resize", () => { if (passes.length) renderChart(+$("slider").value); });

async function showPass(i) {
  const p = passes[i];
  $("pass-date").textContent = `${p.acquisition_date} (${i + 1}/${passes.length})`;
  renderChart(i);
  const stat = (label, value, cls) => {
    const d = node("div", undefined, "stat");
    d.append(node("b", value, cls), node("span", label));
    return d;
  };
  $("stats").replaceChildren(
    stat("Mean NDVI", p.mean_ndvi.toFixed(2)),
    stat(p.alert ? "Alert: vs previous pass" : "Change vs previous", changeText(p), p.alert ? "alert" : ""),
    stat("Min / max", `${p.min_ndvi.toFixed(2)} / ${p.max_ndvi.toFixed(2)}`),
    stat(`Stressed · ${p.stress_zone_count} zone(s)`, `${(p.stressed_area_sqm / 10000).toFixed(2)} ha · ${p.stressed_pct}%`),
    stat("Stress threshold", p.stress_threshold === null ? "no canopy" : `< ${p.stress_threshold.toFixed(2)}`),
    stat("Cloud-free", `${Math.round(p.valid_fraction * 100)}%`),
  );
  whenMap(() => {
    if (!map.getSource("ndvi")) {  // created on first use: a placeholder URL would log aborted loads
      map.addSource("ndvi", { type: "raster", tiles: [p.tile_url], tileSize: 256, maxzoom: 18 });
      map.addLayer({ id: "ndvi", type: "raster", source: "ndvi" }, "fields-fill");
    } else {
      map.getSource("ndvi").setTiles([p.tile_url]);
    }
    map.setLayoutProperty("ndvi", "visibility", "visible");
  });
  const zones = await api(`/stats/${p.id}/zones`);
  if (passes[$("slider").value] !== p) return; // slider moved on while loading
  whenMap(() => showZones(zones));
}

function clearOverlays() {
  if (map.getLayer("ndvi")) map.setLayoutProperty("ndvi", "visibility", "none");
  map.getSource("zones").setData(empty); map.getSource("targets").setData(empty);
}

function showZones(zones) {
  map.getSource("zones").setData(zones);
  map.getSource("targets").setData({ type: "FeatureCollection", features: zones.features.map((z) => ({
    type: "Feature", geometry: z.properties.target, properties: { mean_ndvi: z.properties.mean_ndvi, area_sqm: z.properties.area_sqm } })) });
}
$("slider").oninput = (e) => showPass(+e.target.value);

$("process").onclick = async () => {
  $("process").disabled = true; $("status").textContent = "Searching Sentinel-2 passes…";
  try {
    const job = await api(`/fields/${selected}/process`, { method: "POST", body: "{}" });
    let j = job;
    while (j.status === "queued" || j.status === "running") {
      await new Promise((r) => setTimeout(r, 2000));
      j = await api(`/jobs/${job.id}`);
      $("status").textContent = j.status === "running" ? "Computing NDVI…" : "Queued, waiting for a worker…";
    }
    $("status").textContent = j.status === "done" ? `Stored ${j.passes_stored} new cloud-free pass(es).` : `Failed: ${j.message}`;
    await loadStats();
  } catch (err) { $("status").textContent = err.message; }
  $("process").disabled = false;
};

$("delete").onclick = async () => {
  if (!confirm("Delete this field and all its NDVI history?")) return;
  await api(`/fields/${selected}`, { method: "DELETE" });
  selected = null; $("detail").hidden = true;
  history.replaceState(null, "", location.pathname);
  whenMap(clearOverlays);
  loadFields();
};

loadFields().then(() => {
  const linked = new URLSearchParams(location.hash.slice(1)).get("field");
  if (linked && fields.some((f) => f.id === linked)) select(linked, true);
});
</script>
</body>
</html>
